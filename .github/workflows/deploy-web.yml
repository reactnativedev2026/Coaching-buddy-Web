name: Deploy Web App to Server

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  schedule:
    # 9:00 AM IST (03:30 UTC)
    - cron: '30 3 * * *'
    # 9:00 PM IST (15:30 UTC)
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Web Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: 3. Install Dependencies & Build
        env:
          VITE_GTM_ID: GTM-WDHLBJJ8
          VITE_GA4_MEASUREMENT_ID: G-6CYP5YMSMP
          VITE_GSC_VERIFICATION: lDfVjne-nwT7x8k2-3EDtxKRt82CtZVBLICG0PldwcI
          COACHING_BUDDY_SITEMAP_REQUIRE_API: 1
        run: |
          cd web
          npm install
          npm run build

      - name: 4. Deploy dist to VPS Server via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: 'root'
          TARGET: '/home/coachingbuddy/htdocs/coachingbuddy.co.in/'
          SOURCE: 'web/dist/'
          ARGS: '-avzr'
          SCRIPT_AFTER: |
            chown -R coachingbuddy:coachingbuddy /home/coachingbuddy/htdocs/coachingbuddy.co.in/
            systemctl reload nginx